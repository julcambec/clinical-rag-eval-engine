# Generation configuration
llm:
  provider: "groq"                        # groq | ollama | openai
  model: "llama-3.3-70b-versatile"        # Groq free tier default
  temperature: 0.1                        # low temp = more deterministic/factual
  max_tokens: 1024

prompt:
  active_version: "v1_baseline"           # which prompt file to load from prompts/
  directory: "prompts"
