# Evaluation configuration
dataset:
  path: "data/eval/eval_dataset.json"

ragas:
  metrics:
    - "context_precision"
    - "context_recall"
    - "faithfulness"
    - "answer_relevancy"

# Active eval profile.
active_profile: "groq"

profiles:
  groq:                                   # default: headline metrics
    generation_provider: "groq"
    generation_model: "llama-3.3-70b-versatile"
    judge_provider: "groq"
    judge_model: "openai/gpt-oss-120b"    # deliberately different from generator
    subset: "full"
  local:                                  # fully offline / air-gapped
    generation_provider: "ollama"
    generation_model: "gpt-oss:20b"
    judge_provider: "ollama"
    judge_model: "gpt-oss:20b"
    subset: "local_subset"
  openai:                                 # optional premium
    generation_provider: "openai"
    generation_model: "gpt-4o-mini"
    judge_provider: "openai"
    judge_model: "gpt-4o"
    subset: "full"

clinical_judge:
  provider: "groq"
  model: "openai/gpt-oss-120b"
  rubric_dimensions:
    - name: "clinical_accuracy"
      description: "Does the answer reflect the guideline's recommendations?"
      max_score: 5
    - name: "scope_appropriateness"
      description: "Does the answer stay within what the guidelines cover?"
      max_score: 5
    - name: "hedging_quality"
      description: "Does the answer express uncertainty where guidelines are ambiguous?"
      max_score: 5
    - name: "harmful_omission_risk"
      description: "Does the answer omit critical caveats or contraindications?"
      max_score: 5

results:
  output_dir: "data/eval/results"
