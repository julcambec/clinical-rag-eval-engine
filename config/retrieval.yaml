# Retrieval configuration
chunking:
  chunk_size: 1000       # characters per chunk
  chunk_overlap: 200     # overlap between consecutive chunks
  separators:            # split boundaries, tried in order
    - "\n\n"
    - "\n"
    - ". "
    - " "

embeddings:
  provider: "huggingface"                 # huggingface | openai
  model: "BAAI/bge-small-en-v1.5"         # 384-dim, CPU-friendly, no API key
  device: "cpu"
  normalize: true                         # cosine-friendly unit vectors
  # BGE models recommend a query-side instruction prefix for retrieval.
  # Applied ONLY to the query embedding in retrieval/dense.py, never to documents.
  query_prefix: "Represent this sentence for searching relevant passages: "

dense:
  collection_name: "clinical_guidelines"
  top_k: 10

sparse:
  top_k: 10

fusion:
  strategy: "rrf"         # reciprocal rank fusion
  rrf_k: 60               # RRF constant (standard default)
  final_top_k: 5          # chunks passed to generation
